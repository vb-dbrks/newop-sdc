# Databricks App configuration for Velocia.
# Reference: https://docs.databricks.com/dev-tools/databricks-apps/

command:
  - "uvicorn"
  - "backend.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DATABASE_URL
    valueFrom: "velocia-lakebase-url"        # Databricks secret reference
  - name: AGENT_API_BASE
    value: "https://<workspace>/serving-endpoints/velocia-agent/invocations"
  - name: AGENT_API_TOKEN
    valueFrom: "velocia-agent-token"
  - name: VOLUME_ROOT
    value: "/Volumes/main/velocia/uploads"
  - name: LOG_LEVEL
    value: "INFO"

# Resources required by the app. Provisioned out-of-band; referenced by name.
resources:
  - name: lakebase
    description: "Lakebase Postgres for Velocia OLTP"
  - name: agent-endpoint
    description: "Velocia Agent serving endpoint"
  - name: volume
    description: "Volume root for user-uploaded documents"
