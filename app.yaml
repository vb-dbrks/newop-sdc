# Databricks App runtime config for the Velocia App.
#
# This is consumed by the Databricks Apps runtime (NOT the bundle). The bundle
# (databricks.yml) provisions the Lakebase instance and binds it as an app
# resource named "database", which causes the runtime to inject PGHOST, PGPORT,
# PGUSER, PGDATABASE, PGSSLMODE, PGAPPNAME into the app's env.
#
# Notably, the runtime does NOT inject a static PGPASSWORD — the Postgres
# password is a short-lived OAuth token that backend/db/session.py mints via
# WorkspaceClient.database.generate_database_credential() on each new physical
# pool connection. So this command builds a credential-free DATABASE_URL and
# lets SQLAlchemy + asyncpg pick up user/password from connect_args.
#
# We bind uvicorn to $DATABRICKS_APP_PORT (the runtime-assigned port; never
# hardcode 8000 in production).
#
# `value:` substitution does NOT expand ${VAR} at runtime — that's why we
# go through bash -lc instead of trying to put ${PGHOST} inside a value.

command:
  - "bash"
  - "-lc"
  - |
    set -euo pipefail
    # Databricks Apps inject PG{HOST,PORT,USER,DATABASE,SSLMODE,APPNAME} when a
    # database resource is bound, but NOT a static password. The password is a
    # short-lived OAuth token minted from the app's service principal (the
    # default SDK auth chain picks up DATABRICKS_CLIENT_ID/_CLIENT_SECRET in
    # the runtime). We mint it once at process start and stick it on the
    # async engine; backend/db/session.py refreshes it before each connect via
    # an asyncpg "connect_args" callable.
    export DATABASE_URL="postgresql+asyncpg://${PGHOST}:${PGPORT}/${PGDATABASE}?ssl=require"
    exec uvicorn backend.main:app --host 0.0.0.0 --port "${DATABRICKS_APP_PORT}"

env:
  - name: LOG_LEVEL
    value: "INFO"
  # backend/db/session.py uses this to scope generate_database_credential() —
  # Lakebase tokens are per-instance. Must match resources.database_instances.velocia_db
  # in databricks.yml.
  - name: DATABRICKS_DATABASE_INSTANCE_NAME
    value: "velocia-newop-sdc-db"
  # Postgres schema. The app's service principal creates and owns this schema
  # on first boot (`init_db()`), so no out-of-band GRANT against `public` is
  # ever needed — the SP's `CAN_CONNECT_AND_CREATE` binding is sufficient.
  - name: DB_SCHEMA
    value: "velocia"
  # Zero-touch seed: when SEED_ON_STARTUP=true the lifespan inserts the dev
  # fixture (1 user + 5 studies + 5 author grants) right after init_db. The
  # SEED_USER_EMAIL row is what makes the dashboard non-empty for the first
  # human who logs in via SSO. Idempotent — safe to leave on permanently.
  # Edit the email/name to the customer's primary user before deploying.
  - name: SEED_ON_STARTUP
    value: "true"
  - name: SEED_USER_EMAIL
    value: "dev.user@example.com"
  - name: SEED_USER_NAME
    value: "Dev User"
  # Inert defaults — the agent isn't wired up in this deploy yet, but settings.py
  # requires both to parse cleanly.
  - name: AGENT_API_BASE
    value: "http://localhost:9000"
  - name: AGENT_API_TOKEN
    value: "unset-no-agent-bound-yet"
  - name: VOLUME_ROOT
    value: "/Volumes/main/velocia/uploads"
