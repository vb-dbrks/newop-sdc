    label: Study Details
    fields:
      - { key: study_code,        label: STUDY CODE,        type: text,     required: true,  ordinal: 1 }
      - { key: owner,             label: OWNER,             type: text,     required: false, ordinal: 2 }
      - { key: study_title,       label: STUDY TITLE,       type: textarea, required: true,  ordinal: 3 }
      - { key: description,       label: DESCRIPTION,       type: textarea, required: true,  ordinal: 4 }
      - { key: acronym,           label: ACRONYM,           type: text,     required: false, ordinal: 5 }
      - { key: treatment,         label: TREATMENT,         type: text,     required: false, ordinal: 6 }
      - { key: indications,       label: INDICATION(S),     type: textarea, required: false, ordinal: 7 }
      - { key: intervention_model, label: INTERVENTION MODEL, type: text,   required: false, ordinal: 8 }
      - { key: study_type,        label: STUDY TYPE,        type: text,     required: false, ordinal: 9 }
      - { key: leading_team,      label: AZ TEAM/FUNCTION LEADING STUDY, type: text, required: false, ordinal: 10 }
  # Remaining sections (rationale, objectives, methodology, ...) to be filled in once their field shape is captured.
