# Databricks Asset Bundle for the Velocia App.
#
# Single source of truth for: the FastAPI app on Databricks Apps, the Lakebase
# Postgres instance + database it talks to, env wiring, and sync rules.
#
# Workflow (replace <profile> with your Databricks CLI profile name):
#   databricks bundle validate -t dev --profile <profile>
#   databricks bundle deploy   -t dev --profile <profile>
#   databricks bundle destroy  -t dev --profile <profile> -y
#
# Resource model:
#   - resources.database_instances.velocia_db        — Lakebase Postgres instance
#   - resources.apps.velocia                         — the Databricks App, bound to the database
#
# Schema is auto-created at app startup via SQLAlchemy `Base.metadata.create_all`
# (see backend/db/session.py:init_db). No Alembic.
#
# Note on UC catalog: this bundle deliberately does NOT create a Unity Catalog
# wrapping the Lakebase database, because the app talks to Postgres directly
# via asyncpg and never goes through UC. Creating a UC catalog requires
# `CREATE CATALOG` on the metastore, which many service-principal / engagement
# accounts don't have. If the customer wants UC SQL access to the OLTP data
# later, a UC admin can create the catalog manually after the bundle deploys
# (e.g. `CREATE FOREIGN CATALOG ... USING CONNECTION ...`), or you can
# reinstate the `database_catalogs` resource block below.

bundle:
  name: velocia-newop-sdc
  # Use the direct engine to skip the Terraform download (whose GPG key is
  # currently expired in this CLI version's pin) and to get faster, narrower
  # state semantics. See https://docs.databricks.com/dev-tools/bundles/.
  engine: direct

variables:
  app_name:
    description: "Databricks App name (must be unique in the workspace)."
    default: velocia-newop-sdc
  db_instance_name:
    description: "Lakebase Postgres instance name."
    default: velocia-newop-sdc-db
  db_logical_name:
    description: >-
      Logical Postgres database name to bind the app to. Defaults to
      `databricks_postgres` — the database every Lakebase instance ships
      with — so we don't need a UC catalog (or `CREATE CATALOG` perm) to
      create a custom DB. Override via `--var db_logical_name=...` if you
      want to point at a different database that already exists on the
      instance.
    default: databricks_postgres

# Files to ship to the workspace deployment root. The app's source_code_path
# is the bundle root, so frontend/dist must be present (it's the SPA bundle the
# FastAPI app serves at /). node_modules and .venv must NOT be shipped.
sync:
  include:
    - frontend/dist/**
  exclude:
    - .venv/**
    - venv/**
    - "**/__pycache__/**"
    - "**/.pytest_cache/**"
    - "**/.ruff_cache/**"
    - "**/.mypy_cache/**"
    - "**/*.egg-info/**"
    - frontend/node_modules/**
    - frontend/.vite/**
    - local.db
    - local.db-journal
    - .env
    - .env.local
    - .DS_Store
    - "**/.DS_Store"
    - .git/**
    - .github/**
    - tests/**

resources:
  database_instances:
    velocia_db:
      name: ${var.db_instance_name}
      capacity: CU_1
      node_count: 1

  # Optional — uncomment ONLY if you have CREATE CATALOG on the metastore
  # AND want UC SQL access to the OLTP data. The app itself does not need it.
  #
  # database_catalogs:
  #   velocia_db_catalog:
  #     name: velocia_newop_sdc
  #     database_instance_name: ${resources.database_instances.velocia_db.name}
  #     database_name: ${var.db_logical_name}
  #     create_database_if_not_exists: true

  apps:
    velocia:
      name: ${var.app_name}
      description: "Velocia — clinical study authoring (New Opportunity / SDC / Protocol)."
      source_code_path: .
      resources:
        - name: database
          description: "Lakebase Postgres for OLTP (users, study_documents, audit_log, ...)."
          database:
            instance_name: ${resources.database_instances.velocia_db.name}
            database_name: ${var.db_logical_name}
            permission: CAN_CONNECT_AND_CREATE

# NOTE: we deliberately do NOT use a bundle `scripts:` block to attach source
# code to the app, because the CLI (v0.295) rejects ${var.*} / ${bundle.*} /
# ${workspace.*} interpolation inside script content (says it's ambiguous
# with shell env vars). Instead, `make bundle-deploy` calls
# `python scripts/deploy_app.py --profile ... --target ...` which discovers
# the workspace email via `databricks current-user me` and constructs the
# right /Workspace/Users/<email>/.bundle/<name>/<target>/files path.
# Tracked upstream as databricks/cli#4181.

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Replace with your Databricks workspace URL, e.g.
      #   https://adb-XXXXXXXXXXXX.XX.azuredatabricks.net
      #   https://<workspace>.cloud.databricks.com
      host: https://<your-databricks-workspace-host>
